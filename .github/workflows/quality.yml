name: Quality

on:
  pull_request:
  push:
    branches: [main, master, feat/today-command-center, repair/audit-items-1-9]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Reject high or critical dependency advisories
        run: node scripts/audit-check.mjs
      - run: npm run quality
      - run: npm exec expo-doctor
      - name: Export web bundle
        run: npx expo export --platform web --output-dir /tmp/referralfit-web
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/referralfit-ios
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0
      - name: Replay migrations on a clean local Supabase database
        run: |
          supabase start
          supabase db reset
      - name: Run database pgTAP suite
        run: supabase test db
